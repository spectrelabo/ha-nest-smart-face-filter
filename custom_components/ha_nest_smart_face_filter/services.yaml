analyze_snapshot:
  name: Analyze Snapshot
  description: Triggers face recognition on a specified camera snapshot image.
  fields:
    snapshot_path:
      name: Snapshot Path
      description: Path to the image file to analyze.
      example: /config/www/last_person.jpg
      selector:
        text:
    threshold:
      name: Threshold
      description: Distance threshold for face recognition matching.
      example: 0.45
      selector:
        number:
          min: 0.1
          max: 0.9
          step: 0.05

learn_face:
  name: Learn Face
  description: Registra un nuovo volto noto a partire da un'immagine (es. uno snapshot archiviato in unknown_faces).
  fields:
    image_path:
      name: Image Path
      description: Percorso dell'immagine da cui estrarre il volto.
      example: /config/face_recognition/unknown_faces/unknown_20260101_000000.jpg
      required: true
      selector:
        text:
    name:
      name: Name
      description: Nome dell'identità da assegnare al volto.
      example: mario_rossi
      required: true
      selector:
        text:
