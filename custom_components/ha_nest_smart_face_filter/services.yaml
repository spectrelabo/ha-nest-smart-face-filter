analyze_snapshot:
  name: Analyze Snapshot
  description: Triggers face recognition on a specified camera snapshot image.
  fields:
    snapshot_path:
      name: Snapshot Path
      description: Path to the image file to analyze.
      example: /config/www/last_person.jpg
      selector:
        text:
    threshold:
      name: Threshold
      description: Distance threshold for face recognition matching.
      example: 0.45
      selector:
        number:
          min: 0.1
          max: 0.9
          step: 0.05

analyze_event:
  name: Analyze Event
  description: Analizza un evento Nest (persona/movimento) usando il clip video dell'evento per un riconoscimento facciale più accurato rispetto a camera.snapshot.
  fields:
    device_id:
      name: Device ID
      description: L'ID del dispositivo Nest (visibile nell'URL del dispositivo in Impostazioni > Dispositivi e servizi).
      example: "AVPHwEvXyz..."
      required: true
      selector:
        text:
    event_id:
      name: Event ID
      description: L'ID dell'evento Nest (nest_event_id fornito dal trigger dell'automazione).
      example: "CjY5Y..."
      required: true
      selector:
        text:
    threshold:
      name: Threshold
      description: Distance threshold for face recognition matching.
      example: 0.45
      selector:
        number:
          min: 0.1
          max: 0.9
          step: 0.05


  name: Learn Face
  description: Registra un nuovo volto noto a partire da un'immagine (es. uno snapshot archiviato in unknown_faces).
  fields:
    image_path:
      name: Image Path
      description: Percorso dell'immagine da cui estrarre il volto.
      example: /config/face_recognition/unknown_faces/unknown_20260101_000000.jpg
      required: true
      selector:
        text:
    name:
      name: Name
      description: Nome dell'identità da assegnare al volto.
      example: mario_rossi
      required: true
      selector:
        text:
