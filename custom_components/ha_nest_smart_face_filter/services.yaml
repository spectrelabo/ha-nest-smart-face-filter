analyze_snapshot:
  name: Analyze Snapshot
  description: Triggers face recognition on a specified camera snapshot image.
  fields:
    snapshot_path:
      name: Snapshot Path
      description: Path to the image file to analyze.
      example: /config/www/last_person.jpg
      selector:
        text:
    threshold:
      name: Threshold
      description: Distance threshold for face recognition matching.
      example: 0.45
      selector:
        number:
          min: 0.1
          max: 0.9
          step: 0.05

analyze_event:
  name: Analyze Event
  description: Analyze a Nest event (person/motion) using the event video clip for more accurate face recognition than camera.snapshot.
  fields:
    device_id:
      name: Device ID
      description: The Nest device ID (visible in the device URL under Settings > Devices & Services).
      example: "AVPHwEvXyz..."
      required: true
      selector:
        text:
    event_id:
      name: Event ID
      description: The Nest event ID (nest_event_id provided by the automation trigger).
      example: "CjY5Y..."
      required: true
      selector:
        text:
    threshold:
      name: Threshold
      description: Distance threshold for face recognition matching.
      example: 0.45
      selector:
        number:
          min: 0.1
          max: 0.9
          step: 0.05

learn_face:
  name: Learn Face
  description: Register a new known face from an image (for example, a snapshot archived in unknown_faces).
  fields:
    image_path:
      name: Image Path
      description: Path of the image from which to extract the face.
      example: /config/face_recognition/unknown_faces/unknown_20260101_000000.jpg
      required: true
      selector:
        text:
    name:
      name: Name
      description: Name of the identity to assign to the face.
      example: mario_rossi
      required: true
      selector:
        text:

skip_pending_face:
  name: Skip Pending Face
  description: Move the current unknown face to the back of the queue to review it later.
  fields: {}

discard_pending_face:
  name: Discard Pending Face
  description: Permanently delete the current unknown face from the queue.
  fields: {}
