# ==============================================================================
# LOGICA DI BACKEND DA INSERIRE IN HOME ASSISTANT
# ==============================================================================
# Aggiungi queste sezioni in configuration.yaml o nei rispettivi file suddivisi
# (scripts.yaml, input_text.yaml)
#
# NOTA: a partire da questa versione, lo stato "volto in attesa" non è più
# gestito da input_boolean.volto_in_attesa (rimosso), ma dal sensore
# sensor.<slug>_volti_in_attesa esposto dall'integrazione (vedi
# lovelace_face_validation_card.yaml). Scarta/Prossimo chiamano direttamente
# i servizi ha_nest_smart_face_filter.discard_pending_face /
# skip_pending_face, quindi non serve più lo script "scarta_gestione_volto".

script:
  # ----------------------------------------------------------------------------
  # SCRIPT: Conferma e Registra il volto corrente in coda
  # ----------------------------------------------------------------------------
  conferma_gestione_volto:
    alias: "Conferma Registrazione Volto"
    sequence:
      # 1. Registra il volto corrente in coda (path preso dal sensore, non hardcoded)
      - service: ha_nest_smart_face_filter.learn_face
        data:
          image_path: >-
            {{ state_attr('sensor.nest_smart_face_filter_volti_in_attesa', 'current_path') }}
          name: "{{ states('input_text.nome_nuovo_volto') }}"
      # 2. Resetta l'input text per la prossima volta
      - service: input_text.set_value
        target:
          entity_id: input_text.nome_nuovo_volto
        data:
          value: ""
