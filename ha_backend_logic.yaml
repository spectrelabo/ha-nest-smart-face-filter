# ==============================================================================
# BACKEND LOGIC TO ADD IN HOME ASSISTANT
# ==============================================================================
# Add these sections to configuration.yaml or to the corresponding split files
# (scripts.yaml, input_text.yaml)
#
# NOTE: starting from this version, the "pending face" state is no longer
# managed by input_boolean.volto_in_attesa (removed), but by the sensor
# sensor.<slug>_volti_in_attesa exposed by the integration (see
# lovelace_face_validation_card.yaml). Discard/Next call the
# ha_nest_smart_face_filter.discard_pending_face /
# skip_pending_face services directly, so the "scarta_gestione_volto" script is no longer needed.

script:
  # ----------------------------------------------------------------------------
  # SCRIPT: Confirm and register the current queued face
  # ----------------------------------------------------------------------------
  conferma_gestione_volto:
    alias: "Confirm Face Registration"
    sequence:
      # 1. Register the current queued face (path taken from the sensor, not hardcoded).
      #    IMPORTANT: the learn_face service validates the path with
      #    hass.config.is_allowed_path(). The queue lives under
      #    /config/face_recognition/unknown_faces/ by default, which is NOT in
      #    HA's allowlist_external_dirs unless you add it.
      #    Add this to configuration.yaml and restart HA:
      #
      #      homeassistant:
      #        allowlist_external_dirs:
      #          - /config/face_recognition/unknown_faces
      #
      - service: ha_nest_smart_face_filter.learn_face
        data:
          image_path: >-
            {{ state_attr('sensor.nest_smart_face_filter_volti_in_attesa', 'current_path') }}
          name: "{{ states('input_text.nome_nuovo_volto') }}"
      # 2. Reset the input text for the next time
      - service: input_text.set_value
        target:
          entity_id: input_text.nome_nuovo_volto
        data:
          value: ""
