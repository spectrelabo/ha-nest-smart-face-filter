# ==============================================================================
# HOME ASSISTANT CONFIGURATION FOR FACE RECOGNITION (INTERACTIVE VALIDATION)
# ==============================================================================
# Copy the following sections into your Home Assistant configuration files
# (configuration.yaml / automations.yaml / input_text.yaml)

# ------------------------------------------------------------------------------
# 1. NEW FACE NAME HELPER (configuration.yaml)
# ------------------------------------------------------------------------------
input_text:
  nome_nuovo_volto:
    name: "Name of the New Face to Register"
    initial: ""
    icon: mdi:account-plus

# ------------------------------------------------------------------------------
# 2. AUTOMATION: Nest Camera Trigger + Recognition via Event Media
# ------------------------------------------------------------------------------
# NOTE: This approach uses Nest "device" triggers and the new service
# ha_nest_smart_face_filter.analyze_event (which retrieves the event MP4 clip
# via /api/nest/event_media), instead of camera.snapshot.
# camera.snapshot on many Nest cameras returns black/useless frames
# because it requires an active WebRTC stream — see:
# https://github.com/home-assistant/core/issues/81ocalhost (known HA/Nest issue).
automation:
  - id: nest_camera_face_recognition_pipeline
    alias: "Nest Camera - Face Recognition Pipeline (Event-Based)"
    description: >-
      Analyze the Nest event (person/motion) using the video clip
      from the event instead of camera.snapshot (which on many Nest cameras
      returns black/useless frames).
    mode: single
    max_exceeded: silent
    trigger:
      - platform: device
        device_id: "YOUR_DEVICE_ID_HERE"  # Settings > Devices & Services > Devices > <your doorbell> > check the URL
        domain: nest
        type: camera_person
      - platform: device
        device_id: "YOUR_DEVICE_ID_HERE"
        domain: nest
        type: camera_motion
    action:
      - service: ha_nest_smart_face_filter.analyze_event
        data:
          device_id: "{{ trigger.event.data.device_id }}"
          event_id: "{{ trigger.event.data.nest_event_id }}"

# ------------------------------------------------------------------------------
# 4. ACTIONABLE NOTIFICATION: Unknown Person Notification with Validation Buttons
# ------------------------------------------------------------------------------
  - id: notify_on_unknown_person_detected_actionable
    alias: "Security - Actionable Unknown Person Notification"
    description: "Sends a notification with interactive buttons to decide whether to register or ignore the unknown face."
    trigger:
      - platform: event
        event_type: unknown_person_detected
    action:
      - service: notify.notify
        data:
          title: "⚠️ Unknown Person Detected!"
          message: "An unknown face was detected on the camera. Do you want to register it among the known faces?"
          data:
            url: "/lovelace/face-recognition"
            image: "/local/snapshots/current_pending_face.jpg"
            actions:
              - action: "LEARN_FACE_ACTION"
                title: "👤 Register Face"
              - action: "DISMISS_FACE_ACTION"
                title: "🚫 Ignore"

# ------------------------------------------------------------------------------
# 5. VALIDATION HANDLING: Response to the "Register Face" button
# ------------------------------------------------------------------------------
  - id: handle_learn_face_notification_action
    alias: "Security - Face Registration from Notification"
    description: "Runs face learning when the user presses 'Register Face'."
    trigger:
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: "LEARN_FACE_ACTION"
    action:
      - service: persistent_notification.create
        data:
          title: "👤 Face Validation Requested"
          message: "Enter the name of the new face in the 'input_text.nome_nuovo_volto' field on your dashboard to confirm the capture."
