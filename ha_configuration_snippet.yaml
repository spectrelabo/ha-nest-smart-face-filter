# ==============================================================================
# CONFIGURAZIONE HOME ASSISTANT PER FACE RECOGNITION (VALIDAZIONE INTERATTIVA)
# ==============================================================================
# Copia le sezioni seguenti nei file di configurazione di Home Assistant
# (configuration.yaml / automations.yaml / input_text.yaml)

# ------------------------------------------------------------------------------
# 1. HELPER NOME NUOVO VOLTO (configuration.yaml)
# ------------------------------------------------------------------------------
input_text:
  nome_nuovo_volto:
    name: "Nome Nuovo Volto da Registrare"
    initial: ""
    icon: mdi:account-plus

# ------------------------------------------------------------------------------
# 2. AUTOMATION: Trigger Telecamera Nest + Riconoscimento via Event Media
# ------------------------------------------------------------------------------
# NOTA: Questo approccio usa i trigger "device" di Nest e il nuovo servizio
# ha_nest_smart_face_filter.analyze_event (che recupera il clip MP4 dell'evento
# via /api/nest/event_media), invece di camera.snapshot.
# camera.snapshot su molte telecamere Nest restituisce frame neri/inutilizzabili
# perché richiede uno stream WebRTC attivo — vedi:
# https://github.com/home-assistant/core/issues/81ocalhost (problema noto HA/Nest).
automation:
  - id: nest_camera_face_recognition_pipeline
    alias: "Nest Camera - Pipeline Riconoscimento Facciale (Event-Based)"
    description: >-
      Analizza l'evento Nest (persona/movimento) usando il clip video
      dell'evento invece di camera.snapshot (che su molte telecamere Nest
      restituisce frame neri/inutilizzabili).
    mode: single
    max_exceeded: silent
    trigger:
      - platform: device
        device_id: "IL_TUO_DEVICE_ID_QUI"  # Impostazioni > Dispositivi e servizi > Dispositivi > <tuo campanello> > controlla l'URL
        domain: nest
        type: camera_person
      - platform: device
        device_id: "IL_TUO_DEVICE_ID_QUI"
        domain: nest
        type: camera_motion
    action:
      - service: ha_nest_smart_face_filter.analyze_event
        data:
          device_id: "{{ trigger.event.data.device_id }}"
          event_id: "{{ trigger.event.data.nest_event_id }}"

# ------------------------------------------------------------------------------
# 4. NOTIFICA AZIONABILE: Notifica Persona Sconosciuta con Pulsanti di Validazione
# ------------------------------------------------------------------------------
  - id: notify_on_unknown_person_detected_actionable
    alias: "Sicurezza - Notifica Azionabile Persona Sconosciuta"
    description: "Invia una notifica con pulsanti interattivi per decidere se registrare o ignorare il volto sconosciuto."
    trigger:
      - platform: event
        event_type: unknown_person_detected
    action:
      - service: notify.notify
        data:
          title: "⚠️ Persona Sconosciuta Rilevata!"
          message: "Rilevato volto sconosciuto sulla telecamera. Vuoi registrarlo tra i volti noti?"
          data:
            url: "/lovelace/face-recognition"
            image: "/local/snapshots/last_face_crop.jpg"
            actions:
              - action: "LEARN_FACE_ACTION"
                title: "👤 Registra Volto"
              - action: "DISMISS_FACE_ACTION"
                title: "🚫 Ignora"

# ------------------------------------------------------------------------------
# 5. GESTIONE VALIDAZIONE: Risposta al Pulsante "Registra Volto"
# ------------------------------------------------------------------------------
  - id: handle_learn_face_notification_action
    alias: "Sicurezza - Registrazione Volto da Notifica"
    description: "Esegue l'apprendimento del volto quando l'utente preme 'Registra Volto'."
    trigger:
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: "LEARN_FACE_ACTION"
    action:
      - service: persistent_notification.create
        data:
          title: "👤 Validazione Volto Richiesta"
          message: "Inserisci il nome del nuovo volto nel campo 'input_text.nome_nuovo_volto' sulla tua Dashboard per confermare l'acquisizione."
