title: "Riconoscimento Facciale - Nest"
icon: mdi:face-recognition
path: face-recognition
cards:
  - type: picture
    image: /local/snapshots/last_face_crop.jpg
    title: "Anteprima Volto Rilevato"

  - type: entities
    title: "Pannello di Validazione"
    entities:
      - entity: input_text.nome_nuovo_volto
        name: "Nome del Volto da Registrare"
        icon: mdi:account-edit

      - type: button
        name: "Conferma e Registra Volto"
        icon: mdi:account-check
        action_name: "CONFERMA"
        tap_action:
          action: call-service
          service: notify.mobile_app_your_phone
          service_data:
            title: "Volto Registrato"
            message: "Il nuovo volto e stato registrato con successo tra i volti noti."

      - type: button
        name: "Scarta Volto Sconosciuto"
        icon: mdi:delete-outline
        action_name: "SCARTA"
        tap_action:
          action: call-service
          service: notify.mobile_app_your_phone
          service_data:
            title: "Volto Scartato"
            message: "Lo snapshot del volto e stato scartato."
