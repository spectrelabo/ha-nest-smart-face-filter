title: "Face Recognition - Nest"
icon: mdi:face-recognition
path: face-recognition
cards:
  # CARD 1: when there is at least one unknown face in the queue
  # NOTE: verify the sensor's exact entity_id in your instance
  # (it depends on the name given to the integration during setup).
  - type: conditional
    conditions:
      - entity: sensor.nest_smart_face_filter_volti_in_attesa
        state_not: "0"
    card:
      type: vertical-stack
      title: "Detected Face Validation"
      cards:
        # The integration exposes a 'image.<slug>_pending_face_image' entity
        # that proxies the current pending face through HA's authenticated image
        # API. Use a picture-entity card to display it — no /local/ URL needed.
        # Replace the entity_id below with the one shown in
        # Settings → Devices & Services → your integration → Entities.
        - type: picture-entity
          entity: image.nest_smart_face_filter_pending_face
          show_name: false
          show_state: false

        - type: markdown
          content: >-
            **{{ states('sensor.nest_smart_face_filter_volti_in_attesa') }}**
            face(s) waiting to be handled

        - type: entities
          title: "Validation Panel"
          entities:
            - entity: input_text.nome_nuovo_volto
              name: "Name of the Face to Register"
              icon: mdi:account-edit

            - type: button
              name: "Confirm"
              icon: mdi:account-check
              action_name: "CONFIRM"
              tap_action:
                action: call-service
                service: script.conferma_gestione_volto

            - type: button
              name: "Discard"
              icon: mdi:delete-outline
              action_name: "DISCARD"
              tap_action:
                action: call-service
                service: ha_nest_smart_face_filter.discard_pending_face

            - type: button
              name: "Next"
              icon: mdi:skip-next
              action_name: "NEXT"
              tap_action:
                action: call-service
                service: ha_nest_smart_face_filter.skip_pending_face

  # CARD 2: when the queue is empty
  - type: conditional
    conditions:
      - entity: sensor.nest_smart_face_filter_volti_in_attesa
        state: "0"
    card:
      type: markdown
      title: "Recognition System Active"
      content: |
        ### No face waiting for validation

        All detections have been handled. When the camera detects a new unknown face, the registration card will appear here.
