title: "Riconoscimento Facciale - Nest"
icon: mdi:face-recognition
path: face-recognition
cards:
  # CARD 1: quando c'è almeno un volto sconosciuto in coda
  # NOTA: verifica l'entity_id esatto del sensore nella tua istanza
  # (dipende dal nome dato all'integrazione in fase di configurazione).
  - type: conditional
    conditions:
      - entity: sensor.nest_smart_face_filter_volti_in_attesa
        state_not: "0"
    card:
      type: vertical-stack
      title: "Validazione Volto Rilevato"
      cards:
        # NOTA: la card nativa "type: picture" NON valuta template Jinja nel campo
        # "image" (prende la stringa alla lettera) - usiamo "markdown" con un tag
        # <img>, che supporta i template, per costruire l'URL dinamicamente.
        - type: markdown
          content: >-
            ### Anteprima Volto Rilevato

            <img src="{{ state_attr('sensor.nest_smart_face_filter_volti_in_attesa', 'image_url') }}?t={{ as_timestamp(states.sensor.nest_smart_face_filter_volti_in_attesa.last_changed) }}" style="width:100%;border-radius:8px;" />

        - type: markdown
          content: >-
            **{{ states('sensor.nest_smart_face_filter_volti_in_attesa') }}**
            volto/i in attesa di gestione

        - type: entities
          title: "Pannello di Validazione"
          entities:
            - entity: input_text.nome_nuovo_volto
              name: "Nome del Volto da Registrare"
              icon: mdi:account-edit

            - type: button
              name: "Conferma"
              icon: mdi:account-check
              action_name: "CONFERMA"
              tap_action:
                action: call-service
                service: script.conferma_gestione_volto

            - type: button
              name: "Scarta"
              icon: mdi:delete-outline
              action_name: "SCARTA"
              tap_action:
                action: call-service
                service: ha_nest_smart_face_filter.discard_pending_face

            - type: button
              name: "Prossimo"
              icon: mdi:skip-next
              action_name: "PROSSIMO"
              tap_action:
                action: call-service
                service: ha_nest_smart_face_filter.skip_pending_face

  # CARD 2: quando la coda è vuota
  - type: conditional
    conditions:
      - entity: sensor.nest_smart_face_filter_volti_in_attesa
        state: "0"
    card:
      type: markdown
      title: "Sistema di Riconoscimento Attivo"
      content: |
        ### Nessun volto in attesa di validazione

        Tutti i rilevamenti sono stati gestiti. Quando la telecamera rileverà un nuovo volto sconosciuto, comparirà qui la scheda per la registrazione.
